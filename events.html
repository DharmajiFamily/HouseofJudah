<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MSKNHHV9M6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MSKNHHV9M6');
    </script>

    <link rel="icon" type="image/jpeg" href="1000034613.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | House of Judah</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: #2d0b5a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            text-align: center;
        }
        nav { 
            background: #2d0b5a; 
            padding: 1.5rem 5%; 
            border-bottom: 3px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-text { 
            color: #d4af37; 
            font-weight: bold; 
            letter-spacing: 2px; 
            font-size: 1.5rem; 
            text-transform: uppercase;
            text-decoration: none;
        }
        .container { 
            flex: 1; 
            padding: 40px 20px; 
            max-width: 700px; 
            margin: auto; 
        }
        h1 { color: #d4af37; margin-bottom: 30px; font-size: 2.2rem; }
        
        .event-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid #d4af37;
            text-align: left;
        }
        .event-date {
            color: #d4af37;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }
        .event-status-badge {
            float: right;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
        }
        .event-title {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            color: #fff;
        }

        .cal-btn {
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            padding: 10px 24px;
            text-decoration: none;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            margin-top: 10px;
        }
        
        .cal-btn img {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }

        .cal-btn:hover {
            background-color: #f8f9fa;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }
        footer { 
            background: #1a1a1a; 
            color: #aaa; 
            padding: 25px; 
            font-size: 0.85rem; 
            margin-top: auto;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-text">HOUSE OF JUDAH</a>
    </nav>

    <div class="container">
        <h1>Upcoming Events</h1>
        
        <div id="eventsContainer"></div>

        <br><br>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <footer>2026 House of Judah</footer>

    <script>
    const eventsList = [
        {
            title: "Feast of Trumpets",
            displayDate: "Today (Ends Sunset 7:30 PM)",
            start: new Date(2026, 8, 12, 19, 30), // Sept 12 7:30 PM
            end: new Date(2026, 8, 13, 19, 30),   // Sept 13 7:30 PM
            calStart: "20260912T193000Z",
            calEnd: "20260913T193000Z"
        },
        {
            title: "Day of Atonement",
            displayDate: "Sept 21 Sunset – Sept 22 Sunset (7:30 PM)",
            start: new Date(2026, 8, 21, 19, 30), // Sept 21 7:30 PM
            end: new Date(2026, 8, 22, 19, 30),   // Sept 22 7:30 PM
            calStart: "20260921T193000Z",
            calEnd: "20260922T193000Z"
        },
        {
            title: "Feast of Tabernacles (Sukkot)",
            displayDate: "Sept 26 Sunset – Oct 3 Sunset (7:30 PM)",
            start: new Date(2026, 8, 26, 19, 30), // Sept 26 7:30 PM
            end: new Date(2026, 9, 3, 19, 30),    // Oct 3 7:30 PM
            calStart: "20260926T193000Z",
            calEnd: "20261003T193000Z"
        },
        {
            title: "The 8th Day (Last Great Day)",
            displayDate: "Oct 3 Sunset – Oct 4 Sunset (7:30 PM)",
            start: new Date(2026, 9, 3, 19, 30),  // Oct 3 7:30 PM
            end: new Date(2026, 9, 4, 19, 30),    // Oct 4 7:30 PM
            calStart: "20261003T193000Z",
            calEnd: "20261004T193000Z"
        }
    ];

    function renderEvents() {
        const now = new Date();
        const container = document.getElementById('eventsContainer');
        container.innerHTML = '';

        eventsList.forEach(event => {
            let statusText = "Upcoming";
            let opacityStyle = "1.0";

            if (now >= event.start && now <= event.end) {
                statusText = "Active Now";
            } else if (now > event.end) {
                statusText = "Passed at Sunset";
                opacityStyle = "0.5";
            }

            const encodedTitle = encodeURIComponent(event.title);
            const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodedTitle}&dates=${event.calStart}/${event.calEnd}&details=House+of+Judah+Observance`;

            const card = document.createElement('div');
            card.className = 'event-card';
            card.style.opacity = opacityStyle;
            card.innerHTML = `
                <span class="event-status-badge">${statusText}</span>
                <span class="event-date">${event.displayDate}</span>
                <h2 class="event-title">${event.title}</h2>
                <a href="${calUrl}" target="_blank" class="cal-btn">
                    <img src="unnamed(1).png" alt="Google Calendar Logo">
                    Add to Calendar
                </a>
            `;
            container.appendChild(card);
        });
    }

    window.onload = renderEvents;
    </script>

</body>
</html>
